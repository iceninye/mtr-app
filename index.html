<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="港鐵到站" />
  <link rel="manifest" href="manifest.webmanifest" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>🚇 香港 MTR 實時列車到站資訊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(circle at 0% 0%, rgba(59,130,246,0.18), transparent 45%),
        radial-gradient(circle at 100% 0%, rgba(168,85,247,0.12), transparent 45%),
        #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      min-height: 100dvh;
    }
    .glass {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .skeleton {
      background: linear-gradient(90deg, rgba(148,163,184,0.06) 25%, rgba(148,163,184,0.18) 37%, rgba(148,163,184,0.06) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }
    @keyframes shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }
    .pulse-dot {
      width: 0.55rem; height: 0.55rem; border-radius: 9999px;
      background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,0.6);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
      70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
    .fade-in { animation: fadeIn 0.35s ease-out both; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body>
  <div class="max-w-2xl mx-auto px-4 pt-6 pb-16 sm:pt-10">
    <!-- Header -->
    <header class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">
          🚇 香港 MTR 實時列車到站資訊
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1" id="last-update">載入中...</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="pulse-dot" id="live-dot" title="Live"></span>
        <span class="text-xs text-slate-400 hidden sm:inline">Live</span>
      </div>
    </header>

    <!-- Station selector + controls -->
    <section class="glass rounded-2xl p-4 sm:p-5 mb-4 shadow-lg">
      <div class="flex flex-col gap-3">
        <div class="flex items-center justify-between gap-2">
          <label for="station-select" class="text-sm font-medium text-slate-300">選擇車站</label>
          <span id="geo-badge" class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-slate-700/60 text-slate-300 hidden">GPS</span>
        </div>
        <select id="station-select"
          class="w-full rounded-xl bg-slate-800/80 border border-slate-700 text-slate-100 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40"></select>
        <div class="flex flex-wrap gap-2">
          <button id="geo-btn" type="button"
            class="flex-1 min-w-[8rem] rounded-xl bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-sm font-medium px-3 py-2.5 transition">
            📍 手動重新定位
          </button>
          <button id="refresh-btn" type="button"
            class="flex-1 min-w-[8rem] rounded-xl bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-100 text-sm font-medium px-3 py-2.5 transition">
            🔄 重新整理
          </button>
        </div>
        <p id="geo-notice" class="text-xs text-amber-300/90 hidden"></p>
      </div>
    </section>

    <!-- Auto refresh countdown -->
    <div class="flex items-center justify-between mb-3 text-xs text-slate-400">
      <span>下次自動更新：<span id="countdown" class="font-mono text-slate-200">12</span>s</span>
      <button id="auto-toggle" type="button"
        class="rounded-full bg-slate-800/70 border border-slate-700 px-3 py-1 hover:bg-slate-700 transition">
        <span id="auto-toggle-label">⏸ 暫停自動更新</span>
      </button>
    </div>

    <!-- Main content area -->
    <main id="content" class="space-y-4">
      <!-- Skeleton placeholders (replaced by renderUI) -->
      <div class="glass rounded-2xl p-5 shadow-lg">
        <div class="flex items-center gap-3 mb-4">
          <div class="skeleton h-6 w-32 rounded-full"></div>
          <div class="skeleton h-5 w-16 rounded-full"></div>
        </div>
        <div class="space-y-2">
          <div class="skeleton h-12 rounded-xl"></div>
          <div class="skeleton h-12 rounded-xl"></div>
          <div class="skeleton h-12 rounded-xl"></div>
        </div>
      </div>
    </main>

    <!-- Error / retry banner -->
    <div id="error-banner" class="hidden glass border border-red-500/40 bg-red-900/20 rounded-2xl p-4 mt-4 text-red-200">
      <p class="text-sm font-medium mb-2">⚠️ 取得列車資料時發生錯誤</p>
      <p class="text-xs text-red-300/80 mb-3" id="error-detail"></p>
      <button id="retry-btn" type="button"
        class="rounded-xl bg-red-600 hover:bg-red-500 text-white text-sm font-medium px-4 py-2 transition">
        重試
      </button>
    </div>

    <footer class="mt-10 text-center text-xs text-slate-500">
      <p>資料來源：<a href="https://data.gov.hk/en-data/dataset/mtr-data2-nexttrain-data" target="_blank" rel="noopener noreferrer" class="underline hover:text-slate-300">data.gov.hk MTR Next Train API</a></p>
      <p class="mt-1">本工具只供參考，請以車站現場廣播為準。</p>
    </footer>
  </div>

    'DRL|DIS': { code: 'DIS', name_tc: '迪士尼', name_en: 'Disneyland Resort', line: 'DRL', lat: 22.3158, lng: 114.0444 },
  };

  // -------- Destination code -> station name (for terminus display) --------
  // Best-effort: many UP/DOWN destinations are the line's termini; lookup STATION_MAP by station code, else fallback to code
  const DEST_LOOKUP = (() => {
    const m = {};
    Object.values(STATION_MAP).forEach(s => { m[s.code] = s; });
    return m;
  })();
  function destName(code) {
    const s = DEST_LOOKUP[code];
    return s ? `${s.name_tc} (${code})` : code;
  }

  // -------- Haversine distance (km) --------
  function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // -------- getNearestStation: returns sorted nearest 1-2 --------
  function getNearestStation(lat, lng) {
    if (typeof lat !== 'number' || typeof lng !== 'number') return [];
    return Object.entries(STATION_MAP)
      .map(([key, s]) => ({ key, station: s, dist: haversineKm(lat, lng, s.lat, s.lng) }))
      .sort((a, b) => a.dist - b.dist)
      .slice(0, 2);
  }

  // -------- fetchMTRData: GET schedule, return parsed JSON or null --------
  async function fetchMTRData(line, sta, lang = 'TC') {
    const url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${encodeURIComponent(line)}&sta=${encodeURIComponent(sta)}&lang=${encodeURIComponent(lang)}`;
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 8000);
    try {
      const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (!json || json.status !== 1) throw new Error(json && json.message ? json.message : 'API status not OK');
      return json;
    } catch (e) {
      console.warn('[fetchMTRData]', e);
      return null;
    } finally {
      clearTimeout(tid);
    }
  }

  // -------- renderUI --------
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
  function fmtHHMMSS(t) {
    if (!t || typeof t !== 'string') return '--:--:--';
    const m = t.match(/(\d{2}:\d{2}:\d{2})$/);
    return m ? m[1] : '--:--:--';
  }
  function minutesLabel(ttnt) {
    const n = Number(ttnt);
    if (!Number.isFinite(n)) return '--';
    if (n <= 0) return '即將到站';
    if (n === 1) return '1 分鐘';
    return `${n} 分鐘`;
  }
  function renderDirectionBlock(direction, trains, terminusName, lineColor) {
    const title = direction === 'UP' ? `往 ${terminusName}` : `往 ${terminusName}`;
    const empty = !trains || trains.length === 0;
    const inner = empty
      ? `<div class="text-sm text-slate-400 italic">現無列車服務</div>`
      : `<ul class="space-y-2">${trains.slice(0,4).map(t => `
          <li class="flex items-center justify-between rounded-xl bg-slate-800/60 border border-slate-700/60 px-3 py-2.5">
            <div class="flex flex-col">
              <span class="text-base font-semibold text-slate-100">${escapeHtml(minutesLabel(t.ttnt))}</span>
              <span class="text-xs text-slate-400">ETA ${escapeHtml(fmtHHMMSS(t.time))}</span>
            </div>
            <div class="flex flex-col items-end">
              <span class="text-[10px] uppercase tracking-wider text-slate-400">月台</span>
              <span class="text-lg font-bold" style="color:${lineColor}">${escapeHtml(t.plat || '-')}</span>
            </div>
          </li>`).join('')}</ul>`;
    return `
      <section class="fade-in">
        <h3 class="text-sm font-semibold mb-2 flex items-center gap-2">
          <span class="inline-block w-1.5 h-4 rounded-full" style="background:${lineColor}"></span>
          ${escapeHtml(title)}
        </h3>
        ${inner}
      </section>`;
  }
  function renderUI(station, data) {
    const content = document.getElementById('content');
    const line = LINE_COLORS[station.line] || { name_tc: station.line, color: '#64748b' };
    const key = `${station.line}|${station.code}`;
    const payload = data && data.data && data.data[key];
    if (!payload) {
      content.innerHTML = `
        <article class="glass rounded-2xl p-5 shadow-lg fade-in">
          <div class="flex items-center gap-3 mb-3">
            <span class="rounded-full px-3 py-1 text-xs font-bold text-white" style="background:${line.color}">${escapeHtml(line.name_tc)}</span>
            <h2 class="text-lg font-semibold">${escapeHtml(station.name_tc)} <span class="text-slate-400 text-sm">(${escapeHtml(station.code)})</span></h2>
          </div>
          <div class="text-sm text-slate-400">現無列車服務資料。</div>
        </article>`;
      return;
    }
    const upTerm = payload.UP && payload.UP.length ? destName(payload.UP[0].dest) : '終點站 A';
    const downTerm = payload.DOWN && payload.DOWN.length ? destName(payload.DOWN[0].dest) : '終點站 B';
    const sysTime = data.sys_time || '';
    content.innerHTML = `
      <article class="glass rounded-2xl p-5 shadow-lg fade-in">
        <div class="flex items-center justify-between gap-3 mb-4">
          <div class="flex items-center gap-3 min-w-0">
            <span class="rounded-full px-3 py-1 text-xs font-bold text-white shrink-0" style="background:${line.color}">${escapeHtml(line.name_tc)}</span>
            <h2 class="text-lg sm:text-xl font-semibold truncate">${escapeHtml(station.name_tc)} <span class="text-slate-400 text-sm font-normal">(${escapeHtml(station.code)})</span></h2>
          </div>
          <span class="text-[10px] text-slate-500 shrink-0">${escapeHtml(sysTime)}</span>
        </div>
        <div class="grid sm:grid-cols-2 gap-5">
          ${renderDirectionBlock('UP', payload.UP, upTerm, line.color)}
          ${renderDirectionBlock('DOWN', payload.DOWN, downTerm, line.color)}
        </div>
      </article>`;
  }
  function renderError(detail) {
    document.getElementById('error-banner').classList.remove('hidden');
    document.getElementById('error-detail').textContent = detail || '請檢查網絡連線後重試。';
  }
  function clearError() {
    document.getElementById('error-banner').classList.add('hidden');
  }
  function renderLastUpdate(now) {
    const el = document.getElementById('last-update');
    const t = now || new Date();
    const pad = n => String(n).padStart(2, '0');
    el.textContent = `更新於 ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
  }

  // -------- manualStationSelect: populate dropdown grouped by line, default ISL|ADM --------
  function manualStationSelect() {
    const sel = document.getElementById('station-select');
    sel.innerHTML = '';
    const linesOrder = Object.keys(LINE_COLORS);
    linesOrder.forEach(lineCode => {
      const stations = Object.entries(STATION_MAP)
        .filter(([_, s]) => s.line === lineCode)
        .map(([key, s]) => ({ key, s }));
      if (stations.length === 0) return;
      const og = document.createElement('optgroup');
      og.label = `${LINE_COLORS[lineCode].name_tc}（${lineCode}）`;
      stations.forEach(({ key, s }) => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = `${s.name_tc}（${s.name_en}）— ${s.code}`;
        og.appendChild(opt);
      });
      sel.appendChild(og);
    });
    sel.value = 'ISL|ADM';
  }

  // -------- App state --------
  const state = {
    autoRefresh: true,
    countdownSec: 12,
    countdownTimer: null,
    refreshTimer: null,
    currentKey: 'ISL|ADM',
    nearest: [],
    geoUsed: false,
  };

  async function refresh(key) {
    state.currentKey = key;
    const station = STATION_MAP[key];
    if (!station) { renderError(`車站 ${key} 不存在於內置地圖`); return; }
    clearError();
    const data = await fetchMTRData(station.line, station.code, 'TC');
    if (!data) { renderError('無法取得 MTR 實時列車資料'); return; }
    renderUI(station, data);
    renderLastUpdate();
  }

  function startAutoRefresh() {
    stopAutoRefresh();
    if (!state.autoRefresh) return;
    state.countdownSec = 12;
    state.countdownTimer = setInterval(() => {
      state.countdownSec -= 1;
      document.getElementById('countdown').textContent = state.countdownSec;
      if (state.countdownSec <= 0) {
        state.countdownSec = 12;
        refresh(state.currentKey);
      }
    }, 1000);
    state.refreshTimer = setInterval(() => refresh(state.currentKey), 12000);
  }
  function stopAutoRefresh() {
    if (state.countdownTimer) clearInterval(state.countdownTimer);
    if (state.refreshTimer) clearInterval(state.refreshTimer);
    state.countdownTimer = null; state.refreshTimer = null;
  }

  // -------- Geolocation flow --------
  function setGeoNotice(msg, isError) {
    const el = document.getElementById('geo-notice');
    el.textContent = msg;
    el.classList.remove('hidden', 'text-amber-300/90', 'text-blue-300/90');
    el.classList.add(isError ? 'text-amber-300/90' : 'text-blue-300/90');
  }
  function clearGeoNotice() {
    document.getElementById('geo-notice').classList.add('hidden');
  }

  function tryGeolocate(initial = false) {
    if (!('geolocation' in navigator)) {
      setGeoNotice('您的瀏覽器不支援定位功能，已使用預設車站 金鐘 (ADM)。', true);
      selectStation('ISL|ADM');
      return;
    }
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude } = pos.coords;
      state.nearest = getNearestStation(latitude, longitude);
      if (state.nearest.length === 0) {
        setGeoNotice('定位成功但找不到附近車站，已使用預設車站 金鐘 (ADM)。', true);
        selectStation('ISL|ADM');
        return;
      }
      const top = state.nearest[0];
      state.geoUsed = true;
      const badge = document.getElementById('geo-badge');
      badge.classList.remove('hidden');
      badge.textContent = `📍 ${top.dist.toFixed(1)} km`;
      const nearestOpts = state.nearest.map(n => n.key);
      const currentKey = document.getElementById('station-select').value;
      if (initial || !nearestOpts.includes(currentKey)) {
        setGeoNotice(`已定位至最近車站 ${top.station.name_tc}（${top.station.code}），距離 ${top.dist.toFixed(2)} km。`, false);
        selectStation(top.key);
      } else {
        clearGeoNotice();
      }
    }, err => {
      const msg = err && err.code === 1
        ? '已拒絕定位權限，已使用預設車站 金鐘 (ADM)。'
        : `無法取得定位（${err && err.message ? err.message : 'unknown'}），已使用預設車站 金鐘 (ADM)。`;
      setGeoNotice(msg, true);
      if (initial) selectStation('ISL|ADM');
    }, { timeout: 8000, enableHighAccuracy: false, maximumAge: 60000 });
  }

  function selectStation(key) {
    document.getElementById('station-select').value = key;
    refresh(key);
    document.getElementById('countdown').textContent = state.countdownSec;
  }

  // -------- Init --------
  document.addEventListener('DOMContentLoaded', () => {
    manualStationSelect();
    document.getElementById('station-select').addEventListener('change', e => selectStation(e.target.value));
    document.getElementById('geo-btn').addEventListener('click', () => tryGeolocate(false));
    document.getElementById('refresh-btn').addEventListener('click', () => { refresh(state.currentKey); document.getElementById('countdown').textContent = state.countdownSec; });
    document.getElementById('retry-btn').addEventListener('click', () => refresh(state.currentKey));
    document.getElementById('auto-toggle').addEventListener('click', () => {
      state.autoRefresh = !state.autoRefresh;
      document.getElementById('auto-toggle-label').textContent = state.autoRefresh ? '⏸ 暫停自動更新' : '▶ 恢復自動更新';
      if (state.autoRefresh) startAutoRefresh(); else stopAutoRefresh();
    });

    // Initial load: try geolocate, fallback ADM
    tryGeolocate(true);
    startAutoRefresh();
  });
  </script>
</body>
</html>
